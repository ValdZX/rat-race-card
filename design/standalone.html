document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

pacity:.9}50%{transform:scale(1.035);opacity:1}}\n@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}\n@keyframes ringpulse{0%{box-shadow:0 0 0 0 var(--accent2)}70%{box-shadow:0 0 0 8px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}\n@keyframes seal{0%{transform:scale(.6) rotate(-12deg);opacity:0}55%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}\n@keyframes fly{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:1240px;margin:0 auto;padding:40px 28px 120px;display:flex;flex-direction:column;gap:72px\">\n\n  <header style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;gap:20px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap\">\n      <div style=\"display:flex;flex-direction:column;gap:10px;max-width:820px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;color:var(--accent2);text-transform:uppercase\">Cashflow companion · visual language v2<\u002Fdiv>\n        <h1 style=\"margin:0;font-size:44px;line-height:1.06;font-weight:800;letter-spacing:-.02em;text-wrap:pretty\">Настільна естетика замість комікса.<br>Стани, які видно з іншого боку столу.<\u002Fh1>\n        <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--ink2);max-width:720px;text-wrap:pretty\">Одна позиція: застосунок — це <b style=\"color:var(--ink)\">частина настільної гри<\u002Fb>, а не мобільна аплікація поруч із нею. Матеріали: фарбований картон, фрезерований жетон, латунний маркер. Глибина — на формі, зміщенні й обводці, нуль блюрів. Кожен стан має власний <b style=\"color:var(--ink)\">рід сигналу<\u002Fb>: форму, обводку, бейдж або рух — не лише яскравість.<\u002Fp>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ toggleTheme }}\" style=\"flex:none;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;border:1.5px solid var(--line2);background:var(--s2);color:var(--ink);font-family:Montserrat,sans-serif;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 var(--line)\" style-hover=\"border-color:var(--accent2)\">\n        <span style=\"width:12px;height:12px;border-radius:50%;background:var(--accent);display:block\"><\u002Fspan>\n        <span>{{ themeLabel }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px\">\n      <div style=\"padding:16px;border-radius:18px;background:var(--s2);border:1px solid var(--line);border-bottom:3px solid var(--line2)\">\n        <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:700\">Новий seed<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;margin-top:6px;color:var(--accent2)\">#0F7A3D<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.5;color:var(--ink2);margin-top:6px\">TonalSpot. Глухіший за #A2FF82 — поверхні виходять нейтрально-зеленими, а не кислотними, і семантичні кольори перестають із ним конкурувати.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px;border-radius:18px;background:var(--s2);border:1px solid var(--line);border-bottom:3px solid var(--line2)\">\n        <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:700\">Родів сигналу<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;margin-top:6px\">6 → 6<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.5;color:var(--ink2);margin-top:6px\">Раніше п'ять значень мали одну м'яку тінь. Тепер кожне має власний носій: рамка сцени, підняття, латунний бейдж, база фішки, гравіювання, печатка.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px;border-radius:18px;background:var(--s2);border:1px solid var(--line);border-bottom:3px solid var(--line2)\">\n        <div style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:700\">Бюджет Wasm<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;margin-top:6px\">0 blur<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.5;color:var(--ink2);margin-top:6px\">Тіні — тільки зміщені, без розмиття понад 8dp. Одночасно в кадрі максимум 2 нескінченні анімації.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"position\" style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent2)\">01<\u002Fspan><h2 style=\"margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em\">Що лишається, що йде<\u002Fh2><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px\">\n      <div style=\"padding:20px;border-radius:20px;background:var(--s2);border:1px solid var(--line);border-left:4px solid var(--accent2);display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2)\">Лишається<\u002Fdiv>\n        <sc-for list=\"{{ keeps }}\" as=\"it\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;gap:10px;align-items:flex-start\">\n            <span style=\"flex:none;width:8px;height:8px;border-radius:2px;background:var(--accent2);margin-top:7px\"><\u002Fspan>\n            <div><b style=\"font-size:14px\">{{ it.t }}<\u002Fb><div style=\"font-size:13px;line-height:1.55;color:var(--ink2)\">{{ it.d }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:20px;border-radius:20px;background:var(--s2);border:1px solid var(--line);border-left:4px solid var(--e-negative);display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--e-negative)\">Йде<\u002Fdiv>\n        <sc-for list=\"{{ drops }}\" as=\"it\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;gap:10px;align-items:flex-start\">\n            <span style=\"flex:none;width:8px;height:2px;background:var(--e-negative);margin-top:10px\"><\u002Fspan>\n            <div><b style=\"font-size:14px\">{{ it.t }}<\u002Fb><div style=\"font-size:13px;line-height:1.55;color:var(--ink2)\">{{ it.d }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"states\" style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent2)\">02<\u002Fspan><h2 style=\"margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em\">Мова станів і афордансу<\u002Fh2><\u002Fdiv>\n    <p style=\"margin:0;font-size:15px;line-height:1.65;color:var(--ink2);max-width:840px;text-wrap:pretty\">Правило: <b style=\"color:var(--ink)\">один намір — один носій<\u002Fb>. Носій розрізняється типом, а не насиченістю, тому стани читаються в напівтемряві й поодинці, без сусіда для порівняння. Світіння як сигнал скасоване повністю.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px\">\n\n      <div style=\"padding:20px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <div style=\"font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--ink2)\">STATE / YOUR TURN<\u002Fdiv>\n          <div style=\"font-size:19px;font-weight:800\">Твоя черга<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:var(--ink2)\">Носій — <b style=\"color:var(--ink)\">рамка сцени<\u002Fb>. Не елемент світиться, а сама гра «бере тебе в кадр».<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:relative;height:150px;border-radius:16px;background:var(--s3);overflow:hidden;display:flex;align-items:center;justify-content:center\">\n          <div style=\"position:absolute;inset:6px;border:2px solid var(--accent);border-radius:12px;animation:breathe 2400ms ease-in-out infinite\"><\u002Fdiv>\n          <div style=\"position:absolute;top:6px;left:6px;right:6px;height:26px;border-radius:10px 10px 0 0;background:var(--accent);display:flex;align-items:center;justify-content:center;gap:8px\">\n            <span style=\"font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accentInk)\">Твій хід<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--accentInk)\">0:38<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;margin-top:22px\">\n            <div style=\"width:40px;height:40px;border-radius:14px;background:var(--c-cash);border:1.5px solid var(--e-cash)\"><\u002Fdiv>\n            <div style=\"width:40px;height:40px;border-radius:14px;background:var(--c-store);border:1.5px solid var(--e-store)\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-raw-table style=\"font-size:12.5px\">\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2);width:82px\">Форма<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\">рамка 2dp inset 6dp, r=12dp + верхня плашка 26dp<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2)\">Колір<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\"><code style=\"font-family:'JetBrains Mono',monospace\">accent<\u002Fcode> + <code style=\"font-family:'JetBrains Mono',monospace\">onAccent<\u002Fcode> на плашці<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2)\">Тінь<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\">немає — це фон, не об'єкт<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2)\">Рух<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\">breathe 2400ms, scale 1→1.035, тільки рамка<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <div style=\"padding:20px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <div style=\"font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--ink2)\">STATE / ACTIONABLE<\u002Fdiv>\n          <div style=\"font-size:19px;font-weight:800\">Можна діяти<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:var(--ink2)\">Носій — <b style=\"color:var(--ink)\">фізичне підняття<\u002Fb>: об'єкт стоїть на цоколі 4dp і має тверду обводку.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:150px;border-radius:16px;background:var(--s3);display:flex;align-items:center;justify-content:center;gap:18px\">\n          <div style=\"width:76px;height:76px;border-radius:22px;background:var(--s2);border:2px solid var(--accent);box-shadow:0 4px 0 var(--accent2),0 10px 14px -8px var(--shadow);display:grid;place-items:center;animation:ringpulse 1800ms ease-out infinite\">\n            <div style=\"display:grid;grid-template-columns:repeat(2,10px);gap:8px\">\n              <span style=\"width:10px;height:10px;border-radius:3px;background:var(--ink)\"><\u002Fspan><span style=\"width:10px;height:10px;border-radius:3px;background:var(--ink)\"><\u002Fspan>\n              <span style=\"width:10px;height:10px;border-radius:3px;background:var(--ink)\"><\u002Fspan><span style=\"width:10px;height:10px;border-radius:3px;background:var(--ink)\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;width:58px;height:80px;border-radius:12px;background:var(--c-chance);border:2px solid var(--accent);box-shadow:0 4px 0 var(--accent2),0 10px 14px -8px var(--shadow)\">\n            <div style=\"position:absolute;inset:6px;border:1px dashed var(--e-chance);border-radius:8px\"><\u002Fdiv>\n            <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(45deg);width:16px;height:16px;background:var(--onFill)\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-raw-table style=\"font-size:12.5px\">\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2);width:82px\">Форма<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\">r=22dp (кубик) / 12dp (колода), +2dp розміру<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2)\">Обводка<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\">2dp <code style=\"font-family:'JetBrains Mono',monospace\">accent<\u002Fcode>, суцільна<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2)\">Тінь<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\">цоколь 0/4dp/0 accentDim + 0/10dp/14dp<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2)\">Рух<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\">обводка-пульс 1800ms; press: цоколь 4dp→1dp, 90ms<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <div style=\"padding:20px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <div style=\"font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--ink2)\">STATE / WAITING FOR YOU<\u002Fdiv>\n          <div style=\"font-size:19px;font-weight:800\">Чекає на тебе<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:var(--ink2)\">Носій — <b style=\"color:var(--ink)\">латунний жетон із сумою<\u002Fb>. Сигнал містить цифру, тому не плутається з «натисни мене».<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:150px;border-radius:16px;background:var(--s3);display:flex;align-items:center;justify-content:center;gap:20px\">\n          <div style=\"position:relative;width:96px;height:64px;border-radius:14px;background:var(--c-salary);border:1.5px solid var(--e-salary);display:grid;place-items:center\">\n            <span style=\"font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--onFill)\">ЗАРПЛАТА<\u002Fspan>\n            <div style=\"position:absolute;top:-12px;right:-12px;padding:5px 10px;border-radius:999px;background:var(--brass);border:1.5px solid var(--onFill);box-shadow:0 3px 0 rgba(0,0,0,.35);animation:bob 1800ms ease-in-out infinite\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--brassInk)\">+3 200<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;width:64px;height:64px;border-radius:18px;background:var(--c-start);border:1.5px solid var(--e-start);display:grid;place-items:center\">\n            <span style=\"font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:12px;color:var(--onFill)\">START<\u002Fspan>\n            <div style=\"position:absolute;top:-10px;right:-10px;width:22px;height:22px;border-radius:50%;background:var(--brass);border:1.5px solid var(--onFill);display:grid;place-items:center;animation:bob 1800ms ease-in-out infinite\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--brassInk)\">1<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-raw-table style=\"font-size:12.5px\">\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2);width:82px\">Форма<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\">жетон-пілюля h=24dp, r=12dp, зсув −12/−12dp<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2)\">Колір<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\"><code style=\"font-family:'JetBrains Mono',monospace\">brass<\u002Fcode> — єдине місце, де він живе<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2)\">Обводка<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\">1.5dp <code style=\"font-family:'JetBrains Mono',monospace\">onFill<\u002Fcode> — читається на будь-якій клітинці<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2)\">Рух<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\">bob 1800ms, translateY 3dp — жетон «лежить зверху»<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <div style=\"padding:20px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <div style=\"font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--ink2)\">STATE / IT'S YOU<\u002Fdiv>\n          <div style=\"font-size:19px;font-weight:800\">Це ти<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:var(--ink2)\">Носій — <b style=\"color:var(--ink)\">база фішки<\u002Fb>: подвійне кільце й підпис. Статично, без руху й без accent.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:150px;border-radius:16px;background:var(--s3);display:flex;align-items:center;justify-content:center;gap:16px\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n            <div style=\"width:44px;height:44px;border-radius:50%;background:var(--c-store);border:2px solid var(--onFill);box-shadow:0 3px 0 var(--e-store);display:grid;place-items:center;outline:2px solid var(--ink);outline-offset:3px\">\n              <span style=\"font-family:Montserrat;font-size:15px;font-weight:800;color:var(--onFill)\">О<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;background:var(--ink);color:var(--bg)\">ТИ<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.95\">\n            <div style=\"width:40px;height:40px;border-radius:50%;background:var(--c-desire);border:2px solid var(--e-desire);box-shadow:0 3px 0 var(--e-desire);display:grid;place-items:center\">\n              <span style=\"font-family:Montserrat;font-size:14px;font-weight:800;color:var(--onFill)\">М<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:11px;font-weight:700;color:var(--ink2)\">Марʼяна<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.95\">\n            <div style=\"width:40px;height:40px;border-radius:50%;background:var(--c-funds);border:2px solid var(--e-funds);box-shadow:0 3px 0 var(--e-funds);display:grid;place-items:center\">\n              <span style=\"font-family:Montserrat;font-size:14px;font-weight:800;color:var(--onFill)\">Д<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"font-size:11px;font-weight:700;color:var(--ink2)\">Данило<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-raw-table style=\"font-size:12.5px\">\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2);width:82px\"             <div style=\"display:grid;grid-template-columns:repeat(2,10px);gap:8px;opacity:.75\">\n              <span style=\"width:10px;height:10px;border-radius:3px;background:var(--line2)\"><\u002Fspan><span style=\"width:10px;height:10px;border-radius:3px;background:var(--line2)\"><\u002Fspan>\n              <span style=\"width:10px;height:10px;border-radius:3px;background:var(--line2)\"><\u002Fspan><span style=\"width:10px;height:10px;border-radius:3px;background:var(--line2)\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:13px;font-weight:700;color:var(--ink2)\">Ходить Данило<\u002Fspan>\n            <div style=\"height:6px;width:120px;border-radius:3px;background:var(--s4);overflow:hidden\"><div style=\"width:46%;height:100%;background:var(--line2)\"><\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:11.5px;color:var(--ink2)\">кубик прокинеться сам<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-raw-table style=\"font-size:12.5px\">\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2);width:82px\">Форма<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\">той самий радіус, але цоколь → inset 3dp<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2)\">Колір<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\">заливка → <code style=\"font-family:'JetBrains Mono',monospace\">surface3<\u002Fcode>, іконка → <code style=\"font-family:'JetBrains Mono',monospace\">outline<\u002Fcode><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2)\">Обводка<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\">1.5dp пунктир 2/5dp + штрих 135° крок 7dp<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td style=\"padding:5px 0;color:var(--ink2)\">Рух<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0\">нуль; перехід у стан 160ms<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <div style=\"padding:20px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <div style=\"font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--ink2)\">STATE / IT HAPPENED<\u002Fdiv>\n          <div style=\"font-size:19px;font-weight:800\">Сталося<\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:var(--ink2)\">Носій — <b style=\"color:var(--ink)\">печатка + політ суми<\u002Fb>. Сума летить із клітинки в баланс, на місці лишається штемпель на 1200ms.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:relative;height:150px;border-radius:16px;background:var(--s3);display:flex;align-items:center;justify-content:center;gap:22px;overflow:hidden\">\n          <div style=\"position:relative;width:96px;height:64px;border-radius:14px;background:var(--c-salary);border:1.5px solid var(--e-salary);display:grid;place-items:center\">\n            <span style=\"font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:13px;color:var(--onFill)\">ЗАРПЛАТА<\u002Fspan>\n            <div style=\"position:absolute;inset:-6px;border:2.5px solid var(--accent2);border-radius:18px;animation:seal 520ms ease-out both\"><\u002Fdiv>\n            <div style=\"position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);padding:2px 9px;border-radius:999px;background:var(--accent2);color:var(--accentInk);font-size:11px;font-weight:800;animation:seal 520ms 60ms ease-out both\">ВЗЯТО<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:2px;position:relative\">\n            <span style=\"font-size:11px;color:var(--ink2);font-weight:700\">БАЛАНС<\u002Fspa n-width:660px\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"text-align:left;padding:8px;color:var(--ink2);font-weight:700;border-bottom:1px solid var(--line)\">Стан<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align:left;padding:8px;color:var(--ink2);font-weight:700;border-bottom:1px solid var(--line)\">Носій<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align:left;padding:8px;color:var(--ink2);font-weight:700;border-bottom:1px solid var(--line)\">Форма<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align:left;padding:8px;color:var(--ink2);font-weight:700;border-bottom:1px solid var(--line)\">Колір<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align:left;padding:8px;color:var(--ink2);font-weight:700;border-bottom:1px solid var(--line)\">Рух<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ matrix }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <sc-raw-tr>\n                <sc-raw-td style=\"padding:8px;border-bottom:1px solid var(--line);font-weight:700\">{{ r.a }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:8px;border-bottom:1px solid var(--line);color:var(--accent2);font-weight:700\">{{ r.b }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:8px;border-bottom:1px solid var(--line);color:var(--ink2)\">{{ r.c }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:8px;border-bottom:1px solid var(--line);color:var(--ink2);font-family:'JetBrains Mono',monospace;font-size:11.5px\">{{ r.d }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:8px;border-bottom:1px solid var(--line);color:var(--ink2)\">{{ r.e }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"depth\" style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent2)\">03<\u002Fspan><h2 style=\"margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em\">Глибина без важкості · форма<\u002Fh2><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px\">\n      <div style=\"padding:20px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-size:16px;font-weight:800\">Шість рівнів<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ levels }}\" as=\"l\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <div style=\"flex:none;width:74px;height:44px;border-radius:12px;background:var(--s3);border:1px solid var(--line);box-shadow:{{ l.shadow }}\"><\u002Fdiv>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:13.5px;font-weight:700\">{{ l.name }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--ink2);font-family:'JetBrains Mono',monospace\">{{ l.spec }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.55;color:var(--ink2);border-top:1px solid var(--line);padding-top:12px\">Жодна тінь не має розмиття понад 16dp і всі мають вертикальне зміщення — на Wasm це один прохід. Замість блюру шторки й діалоги відділяються <b style=\"color:var(--ink)\">обводкою 1dp + світлою кромкою зверху<\u002Fb> (inset 1dp <code style=\"font-family:'JetBrains Mono',monospace\">line2<\u002Fcode>), як фрезерований край жетона.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:20px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-size:16px;font-weight:800\">Радіуси<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ radii }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <div style=\"flex:none;width:44px;height:34px;background:var(--s4);border:1.5px solid var(--line2);border-radius:{{ r.px }}\"><\u002Fdiv>\n              <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent2);width:70px;flex:none\">{{ r.val }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:var(--ink2);min-width:0\">{{ r.use }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;line-height:1.55;color:var(--ink2);border-top:1px solid var(--line);padding-top:12px\"><b style=\"color:var(--ink)\">Клітинка отримує радіус 6dp — не нуль.<\u002Fb> Нуль зараз читається як таблиця, а не як гра. Але заокруглення не з’їдає дотик: клітинки стоять із зазором 1.5dp, а трек малює під ними <b style=\"color:var(--ink)\">суцільну підкладку-трек<\u002Fb> на 2dp ширшу за клітинки. Тому проміжки виглядають як розшивка між плитками, а не як дірки, і сусіди не «розвалюються». Ззовні трек обмежений бортиком 2dp — він лишається одним об'єктом.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"cell\" style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent2)\">04<\u002Fspan><h2 style=\"margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em\">Клітинка як об'єкт: 5 родин форми<\u002Fh2><\u002Fdiv>\n    <p style=\"margin:0;font-size:15px;line-height:1.65;color:var(--ink2);max-width:860px;text-wrap:pretty\">25 типів неможливо розрізнити кольором — на 78 клітинках сусідні відтінки зливаються. Тому тип кодується <b style=\"color:var(--ink)\">трьома шарами<\u002Fb>: (1) <b style=\"color:var(--ink)\">родина форми<\u002Fb> — 5 силуетів рамки, читаються з 60 см; (2) <b style=\"color:var(--ink)\">піктограма-примітив<\u002Fb> — трикутник, стовпчики, ромб, кільця, шеврон; (3) колір усередині родини. Підпис — третій за важливістю і на дальньому зумі зникає.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px\">\n\n      <div style=\"padding:18px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;align-items:center\">\n        <div style=\"position:relative;width:104px;height:132px;border-radius:6px;background:var(--c-salary);border:2px solid var(--e-salary);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:10px;box-shadow:0 3px 0 var(--e-salary)\">\n          <div style=\"position:absolute;top:0;left:0;right:0;height:14px;background:var(--e-salary);border-radius:4px 4px 0 0\"><\u002Fdiv>\n          <div style=\"position:absolute;top:26px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px\">\n            <div style=\"width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:13px solid var(--onFill)\"><\u002Fdiv>\n            <div style=\"width:26px;height:5px;background:var(--onFill)\"><\u002Fdiv>\n            <div style=\"width:26px;height:5px;background:var(--onFill)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:13px;letter-spacing:.03em;color:var(--onFill);text-align:center;line-height:1.1\">ЗАРПЛАТА<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"font-size:13.5px;font-weight:800\">Службова<\u002Fdiv><div style=\"font-size:12px;color:var(--ink2);line-height:1.45\">Смуга-капітель зверху. salary, start, rest, inspection<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:18px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;align-items:center\">\n        <div style=\"position:relative;width:104px;height:132px;border-radius:6px;background:var(--c-chance);border:2px solid var(--e-chance);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;box-shadow:0 3px 0 var(--e-chance)\">\n          <div style=\"position:absolute;inset:7px;border:1.5px solid var(--onFill);border-radius:3px;opacity:.55\"><\u002Fdiv>\n          <div style=\"position:absolute;top:0;right:0;width:26px;height:26px;background:var(--e-chance);clip-path:polygon(100% 0,100% 100%,0 0);border-radius:0 4px 0 0\"><\u002Fdiv>\n          <div style=\"position:absolute;top:38px;left:50%;transform:translate(-50%,0) rotate(45deg);width:26px;height:26px;background:var(--onFill);border-radius:4px\"><\u002Fdiv>\n          <span style=\"font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:13px;color:var(--onFill)\">ШАНС<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"font-size:13.5px;font-weight:800\">Карта<\u002Fdiv><div style=\"font-size:12px;color:var(--ink2);line-height:1.45\">Загнутий кут + внутрішня рамка. chance, store, shopping, deputy<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:18px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;align-items:center\">\n        <div style=\"position:relative;width:104px;height:132px;background:var(--c-expenses);border:2px solid var(--e-expenses);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;box-shadow:0 3px 0 var(--e-expenses);border-radius:6px;clip-path:polygon(0 0,100% 0,100% 76%,50% 92%,0 76%)\">\n          <div style=\"position:absolute;top:30px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px\">\n            <div style=\"width:26px;height:5px;background:var(--onFill)\"><\u002Fdiv>\n            <div style=\"width:26px;height:5px;background:var(--onFill)\"><\u002Fdiv>\n            <div style=\"width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:13px solid var(--onFill)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:13px;color:var(--onFill);margin-bottom:14px\">ВИТРАТИ<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"font-size:13.5px;font-weight:800\">Втрата<\u002Fdiv><div style=\"font-size:12px;color:var(--ink2);line-height:1.45\">Виїмка в нижній кромці. expenses, negative, bankruptcy, divorce<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:18px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;align-items:center\">\n        <div style=\"position:relative;width:104px;height:132px;border-radius:6px;background:var(--c-business);border:2px solid var(--e-business);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;box-shadow:0 3px 0 var(--e-business)\">\n          <div style=\"position:absolute;top:8px;left:8px;right:8px;height:1.5px;background:var(--onFill);opacity:.5\"><\u002Fdiv>\n          <div style=\"position:absolute;top:34px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:5px;height:34px\">\n            <div style=\"width:8px;height:14px;background:var(--onFill);border-radius:2px\"><\u002Fdiv>\n            <div style=\"width:8px;height:24px;background:var(--onFill);border-radius:2px\"><\u002Fdiv>\n            <div style=\"width:8px;height:34px;background:var(--onFill);border-radius:2px\"><\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:13px;color:var(--onFill)\">БІЗНЕС<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"font-size:13.5px;font-weight:800\">Актив<\u002Fdiv><div style=\"font-size:12px;color:var(--ink2);line-height:1.45\">Стовпчики + верхня лінія-горизонт. business, funds, cash, positive<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:18px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;align-items:center\">\n        <div style=\"position:relative;width:104px;height:132px;border-radius:6px 6px 26px 26px;background:var(--c-family);border:2px solid var(--e-family);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;box-shadow:0 3px 0 var(--e-family)\">\n          <div style=\"position:absolute;top:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center\">\n            <div style=\"width:26px;height:26px;border-radius:50%;border:4px solid var(--onFill)\"><\u002Fdiv>\n            <div style=\"width:26px;height:26px;border-radius:50%;border:4px solid var(--onFill);margin-left:-10px\"><\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:13px;color:var(--onFill)\">СІМʼЯ<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"text-align:center\"><div style=\"font-size:13.5px;font-weight:800\">Життя<\u002Fdiv><div style=\"font-size:12px;color:var(--ink2);line-height:1.45\">Куполоподібний низ, кільця. family, love, desire, dream<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\">\n        <div style=\"font-size:20px;font-weight:800\">Два вкладені треки · 78 / 74<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:var(--ink2)\">зовнішній 29×20 модулів, обідок 3 модулі · внутрішній 26×17, обідок 2 · зазор 1/3 клітинки<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px\">\n        <div style=\"padding:20px;border-radius:24px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;align-items:center\">\n          <div style=\"align-self:stretch;display:flex;align-items:center;gap:10px\">\n            <span style=\"padding:5px 10px;border-radius:10px;background:var(--accent);color:var(--accentInk);font-size:11px;font-weight:800;letter-spacing:.06em\">СТАН 1<\u002Fspan>\n            <div style=\"font-size:15px;font-weight:800\">Гравець на внутрішньому треку<\u002Fdiv>\n          <\u002Fdiv>\n          <dc-import name=\"Board\" phase=\"inner\" orient=\"landscape\" w=\"{{ boardW }}\" labels=\"on\" decks=\"on\" hint=\"Твоє коло\" hint-size=\"100%,400px\"><\u002Fdc-import>\n          <div style=\"font-size:12.5px;line-height:1.6;color:var(--ink2)\">Внутрішній трек — <b style=\"color:var(--ink)\">фарбовані плитки<\u002Fb>: заливка, кромка, цоколь 1.5dp, ложе під ним підняте (0/3dp/0 + 0/8dp/12dp). Зовнішній у цій фазі — <b style=\"color:var(--ink)\">гравіювання на дошці<\u002Fb>: жодної заливки, контур 1.25dp <code style=\"font-family:'JetBrains Mono',monospace\">outlineStrong<\u002Fcode>, штрих 135°, піктограма відтиском. Він упізнаваний і повний — просто ще <b style=\"color:var(--ink)\">не побудований<\u002Fb>. Це різниця в характері, а не в яскравості: навіть у чорно-білому знімку видно, який трек живий.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px;border-radius:24px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;align-items:center\">\n          <div style=\"align-self:stretch;display:flex;align-items:center;gap:10px\">\n            <span style=\"padding:5px 10px;border-radius:10px;background:var(--brass);color:var(--brassInk);font-size:11px;font-weight:800;letter-spacing:.06em\">СТАН 3<\u002Fspan>\n            <div style=\"font-size:15px;font-weight:800\">Гравець вийшов на зовнішній<\u002Fdiv>\n          <\u002Fdiv>\n          <dc-import name=\"Board\" phase=\"outer\" orient=\"landscape\" w=\"{{ boardW }}\" labels=\"on\" decks=\"on\" hint=\"Щурячі перегони позаду\" hint-size=\"100%,400px\"><\u002Fdc-import>\n          <div style=\"font-size:12.5px;line-height:1.6;color:var(--ink2)\">Трактування міняються місцями, геометрія — ні. Тепер плитки має зовнішній трек, а внутрішній стає гравіюванням-минулим і його ложе втоплюється (inset 0/2dp/0). Зона колод лишається на місці: карти тягнуть в обох фазах, тому вона ніколи не змінює характер.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n        <div style=\"padding:20px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;gap:16px;align-items:center\">\n          <dc-import name=\"Board\" phase=\"inner\" orient=\"portrait\" w=\"150\" labels=\"off\" decks=\"off\" hint-size=\"150px,218px\"><\u002Fdc-import>\n          <div style=\"display:flex;flex-direction:column;gap:8px;min-width:0\">\n            <div style=\"font-size:15px;font-weight:800\">Портрет: 29×20 → 20×29<\u002Fdiv>\n            <div style=\"font-size:12.5px;line-height:1.6;color:var(--ink2)\">Дошка не масштабується — вона <b style=\"color:var(--ink)\">перебудовується<\u002Fb>: довгі сторони стають бічними, кількість клітинок на сторонах міняється, кутові блоки лишаються 3×3 модулі. Одна й та сама розкладка, той самий компонент, інші пропорції.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-size:15px;font-weight:800\">Правила треку<\u002Fdiv>\n          <sc-raw-table style=\"font-size:12.5px\">\n            <sc-raw-tbody>\n              <sc-for list=\"{{ trackRules }}\" as=\"r\" hint-placeholder-count=\"6\">\n                <sc-raw-tr><sc-raw-td style=\"padding:5px 12px 5px 0;color:var(--ink2);white-space:nowrap;vertical-align:top\">{{ r.k }}<\u002Fsc-raw-td><sc-raw-td style=\"padding:5px 0;line-height:1.5\">{{ r.v }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:20px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:15px;font-weight:800\">Стан 2 · момент відкриття зовнішнього треку<\u002Fdiv>\n        <div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:center\">\n          <div style=\"position:relative;flex:none;width:250px;height:96px;border-radius:16px;background:var(--s2);border:1.25px solid var(--line2);background-image:repeating-linear-gradient(135deg,var(--line) 0 1px,transparent 1px 6px);display:grid;place-items:center;overflow:hidden\">\n            <div style=\"position:absolute;inset:0;border-radius:16px;border:2.5px solid var(--brass);animation:seal 520ms ease-out both\"><\u002Fdiv>\n            <div style=\"position:absolute;left:0;top:0;bottom:0;width:38%;background:var(--c-bigBusiness);border-right:1.5px solid var(--e-bigBusiness)\"><\u002Fdiv>\n            <span style=\"position:relative;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)\">Трек будується<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;line-height:1.6;color:var(--ink2);max-width:520px\">Гравіювання не «вмикається» стрибком — воно <b style=\"color:var(--ink)\">заливається<\u002Fb> по треку від кутової клітинки «ЗАРПЛАТА» за годинниковою стрілкою, 1400ms, easeInOutCubic, по 40ms на клітинку. Разом — латунний штемпель по периметру дошки (seal 520ms) і одна шторка з умовами, які гравець щойно виконав. Це єдиний момент партії, коли анімується весь трек; після нього кільце знову статичне.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsection><\u002Fdiv>\n  \n\n  <section id=\"color\" style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;align-items:baseline;gap:14px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent2)\">05<\u002Fspan><h2 style=\"margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em\">Кольорова система<\u002Fh2><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px\">\n      <div style=\"padding:20px;border-radius:20px;background:var(--s1);border:1px solid var(--line)\">\n        <div style=\"font-size:16px;font-weight:800;margin-bottom:12px\">Каркас (Material-ролі)<\u002Fdiv>\n        <sc-raw-table style=\"font-size:12.5px\">\n          <sc-raw-tbody>\n            <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"10\">\n              <sc-raw-tr>\n                <sc-raw-td style=\"padding:6px 8px 6px 0;width:26px\"><span style=\"display:block;width:20px;height:20px;border-radius:6px;border:1px solid var(--line2);background:{{ r.cssvar }}\"><\u002Fspan><\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:6px 0;font-family:'JetBrains Mono',monospace;font-weight:700\">{{ r.name }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:6px 8px;font-family:'JetBrains Mono',monospace;color:var(--ink2)\">{{ r.dark }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:6px 8px;font-family:'JetBrains Mono',monospace;color:var(--ink2)\">{{ r.light }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:6px 0;color:var(--ink2)\">{{ r.use }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <div style=\"padding:20px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px\">\n        <div style=\"font-size:16px;font-weight:800\">Правила<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.6;color:var(--ink2)\">Темна тема: усі заливки клітинок мають однакову світлоту <code style=\"font-family:'JetBrains Mono',monospace\">L 46%<\u002Fcode>, текст на них — єдиний токен <code style=\"font-family:'JetBrains Mono',monospace\">onFill #F4F7F5<\u002Fcode>. Контраст 5.85–7.19:1 на всіх 25 — перевірено, мінімум у <code style=\"font-family:'JetBrains Mono',monospace\">bigBusiness<\u002Fcode>.<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.6;color:var(--ink2)\">Світла тема: заливки <code style=\"font-family:'JetBrains Mono',monospace\">L 90%<\u002Fcode>, текст <code style=\"font-family:'JetBrains Mono',monospace\">onFill #141A18<\u002Fcode>, контраст 12.17–13.52:1. Пастель лишається пастельною, але кромка <code style=\"font-family:'JetBrains Mono',monospace\">edge<\u002Fcode> (L 58%) дає межу, якої зараз немає.<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.6;color:var(--ink2)\">У кожного токена є пара <b style=\"color:var(--ink)\">fill + edge<\u002Fb>. Edge — обводка 1–2dp, цоколь-тінь і колір піктограми на світлій темі. Це те, що робить клітинку об'єктом.<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.6;color:var(--ink2)\"><code style=\"font-family:'JetBrains Mono',monospace\">accent<\u002Fcode> зарезервований <b style=\"color:var(--ink)\">виключно<\u002Fb> під «можна діяти» й «твоя черга». <code style=\"font-family:'JetBrains Mono',monospace\">brass<\u002Fcode> — виключно під «чекає на тебе» й підсумкові суми. Жодна клітинка їх не використовує.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:20px;border-radius:20px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px\">\n      <div style=\"display:flex;justi ew&quot;:{&quot;width&quot;:1320,&quot;height&quot;:900}}\">\nconst G = {\n  tri: 'polygon(50% 0,100% 100%,0 100%)',\n  triDown: 'polygon(0 0,100% 0,50% 100%)',\n  diamond: 'polygon(50% 0,100% 50%,50% 100%,0 50%)',\n  ring: 'circle(50%)',\n  bar: 'polygon(0 60%,33% 60%,33% 100%,0 100%,0 60%,38% 30%,66% 30%,66% 100%,38% 100%,38% 30%,71% 0,100% 0,100% 100%,71% 100%)',\n  chev: 'polygon(50% 0,100% 45%,72% 45%,72% 100%,28% 100%,28% 45%,0 45%)'\n};\n\nclass Component extends DCLogic {\n  state = { theme: 'dark' };\n\n  componentDidMount() {\n    document.documentElement.dataset.theme = 'dark';\n  }\n\n  toggle = () => {\n    const t = this.state.theme === 'dark' ? 'light' : 'dark';\n    document.documentElement.dataset.theme = t;\n    this.setState({ theme: t });\n  };\n\n  ring(count, seq) {\n    const out = [];\n    for (let i = 0; i < count; i++) {\n      const type = seq[i % seq.length];\n      out.push({ deg: (360 / count) * i, type, glyph: G[FAM[type] || 'diamond'] });\n    }\n    return out;\n  }\n\n  renderVals() {\n    const outerSeq = ['start','chance','business','family','expenses','store','cash','salary','shopping','negative','buy','deputy','positive','love','inspection','chance','smallBusiness','divorce','action','funds','expenses','store','desire','rest','bigBusiness','chance','bankruptcy','dream','positive','exaltation'];\n    const innerSeq = ['salary','chance','expenses','business','family','store','negative','buy','positive','rest','shopping','funds','chance','divorce','smallBusiness','love','action','inspection'];\n    return {\n      themeLabel: this.state.theme === 'dark' ? 'Темна тема' : 'Світла тема',\n      toggleTheme: this.toggle,\n      ringOuter: this.ring(78, outerSeq),\n      ringInner: this.ring(74, innerSeq),\n      keeps: KEEPS, drops: DROPS, matrix: MATRIX, levels: LEVELS, radii: RADII,\n      roles: ROLES, tokens: TOKENS, typeScale: TYPE, btnSpec: BTN, motion: MOTION,\n      boardW: 560, trackRules: TRACK,\n      assets: ASSETS, keypad: ['1','2','3','4','5','6','7','8','9','000','0','⌫']\n    };\n  }\n}\n\nconst FAM = {\n  start:'chev', salary:'chev', rest:'ring', inspection:'ring',\n  chance:'diamond', store:'diamond', shopping:'diamond', deputy:'diamond',\n  expenses:'triDown', negative:'triDown', bankruptcy:'triDown', divorce:'triDown',\n  business:'bar', bigBusiness:'bar', smallBusiness:'bar', funds:'bar', cash:'tri', positive:'tri', action:'tri', buy:'tri',\n  family:'ring', love:'ring', desire:'ring', dream:'ring', exaltation:'ring'\n};\n\nconst TRACK = [\n  { k:'Кутова клітинка', v:'блок 3×3 модулі (внутрішній 2×2), радіус 6dp, підпис горизонтальний, ніколи не повертається. Це чотири великі події: зарплата, податкова, банкрутство, мрія.' },\n  { k:'Стик сторін', v:'кути — єдині клітинки, спільні для двох сторін. Тому напрямок читається без стрілок: кут — це поворот, і він завжди більший за сусідів.' },\n  { k:'Напрямок руху', v:'за годинниковою стрілкою від кутової «ЗАРПЛАТА». Кутовий блок несе шеврон-піктограму, повернуту в бік руху; більше стрілок на треку немає.' },\n  { k:'Підписи', v:'верх і низ — повернуті на 90° (клітинка вузька й висока); бічні — горизонтальні; кутові й великі — горизонтальні без повороту. На дальньому зумі підписів немає взагалі, тільки піктограма.' },\n  { k:'Зазор', v:'1.5dp між клітинками, 1/3 клітинки між треками. Обидва треки лежать на власному ложі, тому зазор читається як розшивка.' },\n  { k:'Дотик', v:'клітинка зовнішнього треку 20×60dp, внутрішнього 17×34dp — обидві менші за 44dp, тому хіт-слоп розширює зону до 44dp у бік центру дошки, де немає сусідів.' }\n];\n\nconst KEEPS = [\n  { t: 'Щур-маскот', d: 'Але не як мальований персонаж на фішці, а як одна гравірована піктограма 20dp — знак застосунку, аватар за замовчуванням і фініш-мітка. Один вектор, один колір.' },\n  { t: 'Семантика «кожна сутність має колір»', d: 'Ідея правильна, виконання ні. Лишаємо 25 токенів, перебудовуємо на однакову світлоту й додаємо кромку.' },\n  { t: 'Шторки як єдина навігаці
